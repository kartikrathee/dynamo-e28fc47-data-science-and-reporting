[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: minimum-image PBC, race-free LJ force accumulation, Velocity Verlet staging, RDF shell normalization, and a 5% NVE drift gate over 500 steps at dt=0.0005 (positions evolve enough that wrong physics fails). The serial-vs-parallel timing audit catches fake logs that never executed the binary."
solution_explanation = "solve.sh copies simulation.cpp, Makefile, and run_simulation.sh into /app, generates particles.dat with the instruction's seed-42 Maxwell-Boltzmann lattice, runs /app/run_simulation.sh for the 500-step parallel NVE at dt=0.0005, performs a supplemental OMP_NUM_THREADS=1 timing run without overwriting parallel outputs, then derives all analysis files from the parallel-run logs."
verification_explanation = "Reference values in tests/reference/expected.json were produced by the oracle solve.sh on the digest-pinned python:3.13-slim-bookworm image (g++ -O3 -fopenmp). Step-0 energy rtol=1e-3 (0.1%): step 0 has no integrator history, so the band brackets only OpenMP reduction/accumulation order in KE/PE summation over 1000 particles; wrong Maxwell-Boltzmann or lattice conventions shift KE by O(1), far outside 0.1%. Step-500 total rtol=2e-3 (0.2%): brackets floating-point accumulation over 500 Velocity-Verlet steps; the oracle's NVE drift is ~4.6% of |E0| (instruction PASS gate 5%), so the 2e-3 reference band targets trajectory agreement, not the drift metric—wrong integrators or force bugs miss by >>0.2% while legitimate g++ reordering on the pinned image stays inside the band. RDF peak rtol/abs_tol=0.05 (5%): brackets 0.1-wide shell binning, minimum-image rounding (awk int vs Python round), and trajectory-to-RDF discretization differences between the submitted awk pipeline and pytest recomputation. Rerun rtol=1e-4 (0.01%): same source, compiler flags, and particles.dat with dynamics only through the step-0 log line—fabricated energy.log fails, while benign FP variation on an identical zero-step rerun passes. Temperature statistics rtol=1e-3 vs energy.log. Timing/performance/scaling tests require the exact label strings documented in instruction §2–§3."


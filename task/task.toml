[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: minimum-image PBC, race-free LJ force accumulation, Velocity Verlet staging, RDF shell normalization, seed-42 COM velocity and lattice spacing checks, mid-trajectory step-100/250/400 energy anchors, separate step-500 KE/PE reference gates, and a 5% NVE drift gate over 500 steps at dt=0.0005. The serial-vs-parallel timing audit catches fake logs that never executed the binary."
solution_explanation = "solve.sh copies simulation.cpp, Makefile, and run_simulation.sh into /app, generates particles.dat with the instruction's seed-42 Maxwell-Boltzmann lattice, runs /app/run_simulation.sh for the 500-step parallel NVE at dt=0.0005, performs a supplemental OMP_NUM_THREADS=1 timing run without overwriting parallel outputs, then derives all analysis files from the parallel-run logs."
verification_explanation = "Reference values in tests/reference/expected.json were produced by the oracle solve.sh on the digest-pinned python:3.13-slim-bookworm image (g++ -O3 -fopenmp). Step-0 energy/T rtol=5e-4 (0.05%): wrong Maxwell-Boltzmann or lattice conventions shift KE or T by O(1). Step-100/250/400 total and step-500 KE/PE/total rtol=5e-4 (0.05%): bracket Velocity-Verlet accumulation at multiple trajectory points; drift gate remains 5% in summary.json. Initial geometry: COM velocity |vα| < 0.05 and minimum-image nearest-neighbor distance 1.0 ± 1e-4 from particles.dat. RDF: g(0)=0 exactly; peak rtol=0.02/abs_tol=0.01 under instruction §3 left-edge binning. Rerun rtol=5e-5 recompiles submitted sources, runs from /app, restores parallel logs. Temperature/summary/scaling derived-field rtol=5e-4 vs energy.log and timing.log. Performance/scaling formula rtol=0.02."


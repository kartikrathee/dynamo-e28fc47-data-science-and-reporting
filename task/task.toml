# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "scientific-computing"
subcategories = ["materials-science"]
codebase_size = "minimal"
languages = ["bash", "c++", "awk", "python"]
tags = ["openmp", "molecular-dynamics", "materials-science", "c++", "awk", "scripting"]
expert_time_estimate_min = 45
junior_time_estimate_min = 120

# Sandbox environment limits
[environment]
network_mode = "public"
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0

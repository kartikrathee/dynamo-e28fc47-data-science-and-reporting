[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: minimum-image PBC, race-free LJ force accumulation, Velocity Verlet staging, RDF shell normalization, and a 5% NVE drift gate over 500 steps at dt=0.001 (positions evolve enough that wrong physics fails). The serial-vs-parallel timing audit catches fake logs that never executed the binary."
solution_explanation = "Monolithic solve.sh writes particles.dat via Python, emits simulation.cpp/Makefile/run_simulation.sh under /app, runs 500-step NVE at dt=0.001 with OpenMP, performs a supplemental serial timing run for scaling.txt, then derives all analysis files from the parallel-run outputs."
verification_explanation = "tests/reference/expected.json holds oracle-calibrated step-0 and step-500 energies plus RDF peaks at r=1.0/1.5/2.0 from the pinned image (step-0 rtol 0.1%, final total rtol 0.2%). test_rerun_simulation_reproduces_step0_energy re-executes the submitted binary and requires step-0 total within 0.01%, proving outputs came from a real run. Temperature mean/std/min/max rtol 0.1% vs energy.log; RDF bins rtol 5% for discretization. Drift must be below 5% as stated in the instruction. Performance and scaling fields check positivity and formula consistency only—no unstated throughput floors."


[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: undisclosed Box-Muller-to-(vx,vy,vz) convention checked on particles 0/42/999, mid-lattice particle-42 site catches wrong id-to-(x,y,z) mapping, minimum-image PBC, race-free LJ force accumulation, RDF shell normalization, COM velocity and lattice spacing, mid-trajectory total-energy anchors at rtol 0.2%, dual rerun anti-cheat, serial-must-be-slower scaling audit, and a 5% NVE drift gate. Mid-trajectory rtol brackets fp/OpenMP variation among valid race-free NVE implementations."
solution_explanation = "solve.sh copies simulation.cpp, Makefile, and run_simulation.sh into /app, generates particles.dat with the instruction's seed-42 Maxwell-Boltzmann lattice, runs /app/run_simulation.sh for the 500-step parallel NVE at dt=0.0005, performs a supplemental OMP_NUM_THREADS=1 timing run without overwriting parallel outputs, then derives all analysis files from the parallel-run logs."
verification_explanation = "Reference values in tests/reference/expected.json from oracle on digest-pinned python:3.13-slim-bookworm (g++ -O3 -fopenmp). Step-0 IC/energy/T rtol=1e-3; particles 0/42/999 lattice+velocities abs_tol=1e-5. Mid-trajectory total energies rtol=2e-3 bracket fp/OpenMP ordering among race-free NVE Velocity-Verlet implementations (KE/PE components not gated separately). Drift gate 5%. Rerun step-0 rtol=1e-4; step-250 rtol=2e-3 from /app. RDF: g(0)=0, self-consistency with trajectory, first-shell peak >1 in 0.8–2.5 (not oracle peak values). scaling.txt requires serial runtime > parallel runtime."


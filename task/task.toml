[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: Box-Muller u1 radius and cos-vz convention on particles 0/42/999, x-fastest lattice id mapping, minimum-image PBC, race-free LJ force accumulation with pre-allocated thread buffers, RDF left-edge shell normalization, mid-trajectory total-energy anchors at rtol 0.2%, 10% parallel force speedup gate (not total-runtime padding), Makefile clean scope, and a 5% NVE drift gate."
solution_explanation = "solve.sh copies simulation.cpp (race-free OpenMP pairwise force loop via per-thread force buffers; force and integration timers are non-overlapping with per-step energy/I/O counted in integration), Makefile, and run_simulation.sh into /app, generates particles.dat with seed-42 Maxwell-Boltzmann lattice, runs /app/run_simulation.sh for the 500-step parallel NVE at OMP_NUM_THREADS=4, performs a supplemental OMP_NUM_THREADS=1 timing run without overwriting parallel outputs, then derives all analysis files from the parallel-run logs."
verification_explanation = "Oracle on digest-pinned python:3.13-slim-bookworm (g++ -O3 -fopenmp, cpus=2 matching GitHub-hosted runners). Step-0 IC/energy/T rtol=1e-3 brackets digest-pinned Python IC generation only. IC velocities abs_tol=1e-5 on particles 0/42/999 trap Box-Muller u1-radius and cos-vz ordering. Mid-trajectory total-energy rtol=2e-3 was calibrated on the oracle plus alternate race-free VV/OpenMP implementations to accept fp summation differences without oracle trajectory lock-in. RDF self-consistency rel/abs_tol=0.02/0.01 matches left-edge shell discretization noise. Force-speedup gate parallel_force*1.10<=serial_force on the 500-step scaling runs: 10% margin validated on oracle reruns (~1.29x with OMP_NUM_THREADS=4 on 2 physical cores) to reject critical-section or per-call-alloc force loops while absorbing wall-clock jitter. timing.log partitions force (all calculate_forces calls) vs integration (per-step energy/trajectory I/O plus VV kicks, excluding force); total must cover force+integration within 0.1% and overhead/total<=18%. Serial total/force ratio cap 1.15x parallel catches disproportionate serial-runtime padding. Source sleep scan plus scaling.txt force-time cross-check block timing padding. Rerun step-0 rtol=1e-4; step-250 rtol=2e-3."


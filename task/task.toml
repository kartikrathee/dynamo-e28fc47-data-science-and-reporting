[task]
name = "dynamo/lj-nve-openmp"
description = "Build and validate a parallel Lennard-Jones NVE molecular dynamics pipeline in C++ with OpenMP."

[metadata]
category = "scientific_computing_and_domain_science"
subcategory = "chemistry_and_materials_workflows"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["implement", "analyze"]
artifact_type = ["mathematical_or_scientific_model", "generated_output_artifact", "codebase"]
expert_time_estimate_hours = 2.5
difficulty_explanation = "Synthetic data only: a Python random.seed(42) lattice at T=1 with no external dataset. Materials/HPC engineers run this style of pipeline to validate integrators and OpenMP scaling before production MD. Traps: undisclosed Box-Muller-to-(vx,vy,vz) convention checked on particles 0/42/999, mid-lattice particle-42 site catches wrong id-to-(x,y,z) mapping, minimum-image PBC, race-free LJ force accumulation, RDF shell normalization, COM velocity and lattice spacing, mid-trajectory total-energy anchors at rtol 0.2%, dual rerun anti-cheat, parallel force faster than serial (not total-runtime padding), Makefile clean must not delete outputs, and a 5% NVE drift gate."
solution_explanation = "solve.sh copies simulation.cpp, Makefile, and run_simulation.sh into /app, generates particles.dat with the instruction's seed-42 Maxwell-Boltzmann lattice, runs /app/run_simulation.sh for the 500-step parallel NVE at dt=0.0005, performs a supplemental OMP_NUM_THREADS=1 timing run without overwriting parallel outputs, then derives all analysis files from the parallel-run logs."
verification_explanation = "Oracle on digest-pinned python:3.13-slim-bookworm (g++ -O3 -fopenmp). IC/energy gates as before. scaling.txt parallel force < serial force and must match timing.log; serial total/force ratio bounded vs parallel to catch sleep padding. Undisclosed verifier reruns at steps 87 and 173 remeasure force time at OMP 4 vs 1. simulation.cpp scanned for sleep. make compiles in temp dir."

